<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>行動評価記録</title>
    <style>
        /* 文字サイズを全体的に大きく設定 */
        body { font-family: sans-serif; margin: 0; padding: 15px; background-color: #f9f9f9; font-size: 1.2rem; }
        h2 { font-size: 1.5rem; margin: 15px 0; }
        
        .input-group { background: #fff; padding: 20px; border-radius: 12px; margin-bottom: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        
        .item { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 2px solid #eee; }
        
        /* セレクトボックスと日付入力のサイズ拡大 */
        select, input[type="date"] { padding: 12px; font-size: 1.2rem; border-radius: 8px; border: 1px solid #ccc; width: 100%; }
        
        /* ボタンのサイズを大きくして押しやすく */
        button { width: 100%; padding: 20px; font-size: 1.3rem; border: none; border-radius: 12px; margin-top: 15px; color: #fff; font-weight: bold; }
        
        #tableContainer { overflow-x: auto; margin-top: 30px; }
        table { border-collapse: collapse; width: 100%; font-size: 1rem; }
        th, td { border: 2px solid #ccc; padding: 12px; white-space: nowrap; text-align: center; }
        .total-row { font-weight: bold; background-color: #e9e9e9; }
    </style>
</head>
<body>

<h2>日次評価入力</h2>
<div class="input-group">
    <input type="date" id="recordDate">
    <div id="fields"></div>
    <button onclick="saveData()" style="background: #007bff;">保存する</button>
</div>

<button onclick="displayData()" style="background: #28a745;">今月の一覧と累計を表示</button>
<button onclick="clearData()" style="background: #dc3545;">全データ削除</button>

<div id="tableContainer"></div>

<script>
    const categories = ["7時半を過ぎて起きた", "朝の連絡LINEが遅い", "9時を過ぎて出勤(ちこく)", "自殺LINE", "いじめ思い込みLINE", "エロLINE", "平日LINE7回以上", "休日LINE9回以上", "1スタンプ/LINE違反", "7時より前のLINE", "就寝報告以降LINE", "ギャラクシースマホ未返却", "リモートリクエスト", "緊急リモートあり", "母に電話させる", "母の電話で電話する", "LINEで相談", "逆切れ言葉", "〇〇をやめます", "買物計画外での買物希望", "買物計画外で無断買物実行", "マナー違反しているのに希望ばかり言う", "大げさな体調不良PR", "救急車を呼ぶ", "母に救急車を要請", "他人にケガをさせた", "知らない人に声をかける", "よその家に行った", "その他の違反"];

    const fieldsDiv = document.getElementById('fields');
    categories.forEach(cat => {
        fieldsDiv.innerHTML += `<div class="item"><span>${cat}</span>
            <select class="score" data-name="${cat}">
                ${[0,1,2,3,4,5,6].map(i => `<option value="${i}">${i}</option>`).join('')}
            </select></div>`;
    });

    document.getElementById('recordDate').valueAsDate = new Date();

    function saveData() {
        const date = document.getElementById('recordDate').value;
        const data = { date };
        document.querySelectorAll('.score').forEach(s => data[s.dataset.name] = parseInt(s.value));
        let records = JSON.parse(localStorage.getItem('evalRecords') || '[]');
        records.push(data);
        localStorage.setItem('evalRecords', JSON.stringify(records));
        alert("保存しました！");
    }

    function displayData() {
        const records = JSON.parse(localStorage.getItem('evalRecords') || '[]');
        let totals = {};
        categories.forEach(c => totals[c] = 0);

        let html = '<table><tr><th>日付</th>' + categories.map(c => `<th>${c.substring(0,3)}...</th>`).join('') + '</tr>';
        
        records.sort((a,b) => a.date.localeCompare(b.date)).forEach(r => {
            html += `<tr><td>${r.date.substring(5)}</td>`;
            categories.forEach(c => {
                const val = r[c] || 0;
                html += `<td>${val}</td>`;
                totals[c] += parseInt(val);
            });
            html += '</tr>';
        });

        html += `<tr class="total-row"><td>合計</td>` + categories.map(c => `<td>${totals[c]}</td>`).join('') + '</tr>';
        document.getElementById('tableContainer').innerHTML = html + '</table>';
    }

    function clearData() {
        if (confirm("全ての記録を削除しますか？")) {
            localStorage.removeItem('evalRecords');
            document.getElementById('tableContainer').innerHTML = "";
            alert("データを削除しました。");
        }
    }
</script>
</body>
</html>
